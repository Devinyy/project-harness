# .codex/config.toml — 项目级 Codex 配置

# --- 行为 ---
# model 不在项目级指定，由个人 ~/.codex/config.toml 配置
approval_policy = "on-request"

# --- 上下文管理 ---
project_doc_max_bytes = 8192
project_doc_fallback_filenames = ["CLAUDE.md"]

# --- Hooks ---
# 需要在 ~/.codex/config.toml 中开启：
# [features]
# codex_hooks = true
#
# 审计只读取官方公共字段 hook_event_name / permission_mode / tool_name，不依赖自定义输入。
# 命令工具覆盖 Bash/exec_command 等别名；写入工具覆盖 apply_patch/Edit/Write。
# 所有仓库内 Hook 都从 Git 根目录解析，避免在子目录执行时失效。

[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/scripts/doctor.sh"'
timeout = 10

[[hooks.PreToolUse]]
matcher = "Bash|shell|exec_command|local_shell"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/.codex/hooks/block-dangerous-commands.sh"'
timeout = 10

[[hooks.PreToolUse]]
matcher = "apply_patch|Edit|Write"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/.codex/hooks/guard-dangerous-zones.sh"'
timeout = 10

[[hooks.PostToolUse]]
matcher = "Bash|shell|exec_command|local_shell|apply_patch|Edit|Write"

[[hooks.PostToolUse.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/.codex/hooks/format-on-write.sh"'
timeout = 15

[[hooks.PostToolUse]]
matcher = "*"

[[hooks.PostToolUse.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/scripts/record-permission-outcome.sh codex"'
timeout = 10

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/.codex/hooks/verify-before-stop.sh"'
timeout = 30
